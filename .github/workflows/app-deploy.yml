# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# Deploying is a deliberate, manual action: pushing to main no longer
# triggers a deploy by itself (app/ has no CI workflow to gate on either).
# Trigger a deploy from the Actions tab ("Run workflow") or
# `gh workflow run app-deploy.yml`.

name: Vinyl App Fly Deploy

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-vinyl-app
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
