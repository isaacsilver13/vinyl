name: Vinyl App Daily Discogs Refresh

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC (4 AM ET / 1 AM PT) every day
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

permissions:
  contents: read
  issues: write

defaults:
  run:
    working-directory: app

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate Fly.io authentication
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
        run: |
          test -n "$FLY_API_TOKEN" || { echo "FLY_API_TOKEN is not configured."; exit 1; }
          flyctl auth whoami

      - name: Start Fly machine for refresh
        id: start_machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
        run: |
          set -euo pipefail

          machine_json="$(flyctl machine list --app vinyl-catalog --json)"
          machine_id="$(jq -r '.[0].id // empty' <<< "$machine_json")"
          machine_state="$(jq -r '.[0].state // empty' <<< "$machine_json")"

          if [ -z "$machine_id" ]; then
            echo "No Fly machine found for vinyl-catalog."
            exit 1
          fi

          echo "Using Fly machine $machine_id (state: $machine_state)."
          if [ "$machine_state" != "started" ]; then
            flyctl machine start "$machine_id" --app vinyl-catalog
          fi
          flyctl machine wait "$machine_id" \
            --app vinyl-catalog \
            --state started \
            --wait-timeout 5m

          echo "machine_id=$machine_id" >> "$GITHUB_OUTPUT"

      - name: Run refresh via Fly.io machine exec
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
        run: |
          # `flyctl ssh console` proxies an interactive shell through
          # flyctl's own userland WireGuard tunnel, which has documented
          # community reports of dropping long-held sessions with exactly
          # the error seen on the last two scheduled runs here ("ssh shell:
          # wait: remote command exited without exit status or exit
          # signal", 5-7 minutes in, with refresh_all.py still healthy per
          # its own logs). `flyctl machine exec` runs the command through
          # the Machines API's exec mechanism instead of that SSH proxy and
          # takes its own explicit --timeout, so it isn't subject to the
          # same tunnel session-durability limits. 600s (10m) is the max
          # the Machines API allows for a single exec (a larger value is
          # rejected outright: "timeout must not exceed 600 seconds") --
          # this is a hard ceiling, not a tuning choice.
          #
          # Same setpriv rationale as before: the machine's default exec
          # user is root, but /data is owned by appuser (per
          # app/entrypoint.sh), so this drops privileges the same way.
          flyctl machine exec "${{ steps.start_machine.outputs.machine_id }}" \
            "setpriv --reuid=appuser --regid=appuser --init-groups python /app/refresh_all.py --force" \
            --app vinyl-catalog \
            --timeout 600

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Daily refresh failed — ${new Date().toISOString().slice(0, 10)}`;
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = `The scheduled **Vinyl App Daily Discogs Refresh** workflow failed.\n\nRun: ${runUrl}`;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });

            const existing = openIssues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
