name: Vinyl App Daily Discogs Refresh

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC (4 AM ET / 1 AM PT) every day
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

permissions:
  contents: read
  issues: write

defaults:
  run:
    working-directory: app

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate Fly.io authentication
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
        run: |
          test -n "$FLY_API_TOKEN" || { echo "FLY_API_TOKEN is not configured."; exit 1; }
          flyctl auth whoami

      - name: Start Fly machine for refresh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
        run: |
          set -euo pipefail

          machine_json="$(flyctl machine list --app vinyl-catalog --json)"
          machine_id="$(jq -r '.[0].id // empty' <<< "$machine_json")"
          machine_state="$(jq -r '.[0].state // empty' <<< "$machine_json")"

          if [ -z "$machine_id" ]; then
            echo "No Fly machine found for vinyl-catalog."
            exit 1
          fi

          echo "Using Fly machine $machine_id (state: $machine_state)."
          if [ "$machine_state" != "started" ]; then
            flyctl machine start "$machine_id" --app vinyl-catalog
          fi
          flyctl machine wait "$machine_id" \
            --app vinyl-catalog \
            --state started \
            --wait-timeout 5m

      - name: Run refresh via Fly.io SSH
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
        run: |
          # SSH into the running machine and run the refresh script.
          # `flyctl ssh console` gives a root shell, but the app itself (and
          # /data's ownership, per app/entrypoint.sh) runs as the unprivileged
          # appuser -- running this as root would leave any file it writes in
          # /data root-owned, which appuser then can't write to until the
          # next restart re-runs entrypoint.sh's chown. setpriv (same
          # mechanism entrypoint.sh uses to drop privileges) keeps this
          # consistent instead of introducing a separate su-based path.
          flyctl ssh console \
            --app vinyl-catalog \
            --command "setpriv --reuid=appuser --regid=appuser --init-groups python /app/refresh_all.py --force" \
            --quiet

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Daily refresh failed — ${new Date().toISOString().slice(0, 10)}`;
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = `The scheduled **Vinyl App Daily Discogs Refresh** workflow failed.\n\nRun: ${runUrl}`;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });

            const existing = openIssues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
