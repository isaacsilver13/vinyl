name: Vinyl App Daily Discogs Refresh

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC (4 AM ET / 1 AM PT) every day
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

permissions:
  contents: read
  issues: write

defaults:
  run:
    working-directory: app

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate Fly.io authentication
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
        run: |
          test -n "$FLY_API_TOKEN" || { echo "FLY_API_TOKEN is not configured."; exit 1; }
          flyctl auth whoami

      - name: Start Fly machine for refresh
        id: start_machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
        run: |
          set -euo pipefail

          machine_json="$(flyctl machine list --app vinyl-catalog --json)"
          machine_id="$(jq -r '.[0].id // empty' <<< "$machine_json")"
          machine_state="$(jq -r '.[0].state // empty' <<< "$machine_json")"

          if [ -z "$machine_id" ]; then
            echo "No Fly machine found for vinyl-catalog."
            exit 1
          fi

          echo "Using Fly machine $machine_id (state: $machine_state)."
          if [ "$machine_state" != "started" ]; then
            flyctl machine start "$machine_id" --app vinyl-catalog
          fi
          flyctl machine wait "$machine_id" \
            --app vinyl-catalog \
            --state started \
            --wait-timeout 5m

          echo "machine_id=$machine_id" >> "$GITHUB_OUTPUT"

      - name: Start refresh in background over SSH
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
        run: |
          # Three approaches were tried and ruled out before this one:
          #   - `flyctl ssh console --command ...` holding the session open
          #     for the job's full duration: the tunnel doesn't reliably
          #     survive that long (dropped mid-session on the 2026-09-12/13
          #     scheduled runs -- "ssh shell: wait: remote command exited
          #     without exit status or exit signal").
          #   - `flyctl machine exec`: the Machines API's exec endpoint has
          #     a hard, non-configurable 60s server-side timeout -- far too
          #     short, confirmed via Fly's own community forum.
          #   - `fly console` (a `console_command` spawning a temporary
          #     machine): temporary machines don't get volume mounts, so it
          #     can't reach /data (the SQLite DB and Discogs tokens the
          #     refresh needs); Fly volumes are also strictly single-attach,
          #     so a second machine couldn't share the running one's volume
          #     anyway.
          #
          # Instead: a brief SSH call starts the job fully detached
          # (app/scripts/run_refresh_background.sh: setsid + nohup, stdio
          # redirected to a log file) and returns immediately: it never
          # holds one connection open for the job's full duration. The next
          # step polls for completion via separate short-lived SSH calls.
          flyctl ssh console \
            --app vinyl-catalog \
            --command "sh /app/scripts/run_refresh_background.sh" \
            --quiet

      - name: Poll for refresh completion
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_WEB }}
        run: |
          set -euo pipefail
          status="RUNNING"
          # 40 * 30s = 20 minutes -- comfortable headroom above the longest
          # refresh observed so far (~7-8 minutes in, still mid-collection-
          # sync, before the old ssh-console approach used to die).
          for i in $(seq 1 40); do
            # `|| true` on the substitution itself, not just the pipeline:
            # with `set -e`, a failing command substitution assigned to a
            # variable aborts the whole script even outside a conditional --
            # a single transient SSH blip on one poll attempt must not kill
            # 20 minutes of otherwise-successful polling. A blip just shows
            # up as an empty/unchanged status and gets retried next loop.
            status="$(flyctl ssh console --app vinyl-catalog --command "sh /app/scripts/refresh_status.sh" --quiet 2>/dev/null | tail -1 | tr -d '\r' || true)"
            echo "[$i/40] ${status:-<poll failed, will retry>}"
            case "$status" in
              DONE*) break ;;
            esac
            sleep 30
          done

          case "$status" in
            DONE*) : ;;
            *)
              echo "Refresh did not finish within the poll window (20 minutes)."
              exit 1
              ;;
          esac

          exit_code="${status#DONE }"

          echo "----- last 100 lines of refresh.log -----"
          flyctl ssh console --app vinyl-catalog --command "tail -n 100 /tmp/refresh.log" --quiet 2>/dev/null || true

          if [ "$exit_code" != "0" ]; then
            echo "refresh_all.py exited with code $exit_code"
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Daily refresh failed — ${new Date().toISOString().slice(0, 10)}`;
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = `The scheduled **Vinyl App Daily Discogs Refresh** workflow failed.\n\nRun: ${runUrl}`;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });

            const existing = openIssues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
