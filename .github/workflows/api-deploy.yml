name: Vinyl API Fly Deploy

# Deploy is gated on Vinyl API CI (api-ci.yml) succeeding: this workflow no
# longer triggers on push directly (a broken test suite would otherwise
# still deploy), and instead triggers when the CI workflow finishes running
# on main. `workflow_run` doesn't support `paths:` filtering, but that's
# fine here -- api-ci.yml is already scoped to `paths: ['api/**']`, so it
# (and therefore this deploy) only runs/succeeds for pushes that touch
# api/**.
on:
  workflow_run:
    workflows: ["Vinyl API CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: api

jobs:
  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    concurrency: deploy-vinyl-api
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        run: flyctl deploy --config fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_API }}
