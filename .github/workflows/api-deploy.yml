name: Vinyl API Fly Deploy

# Deploying is a deliberate, manual action: pushing to main (even once CI
# has passed) no longer triggers a deploy by itself. Trigger a deploy from
# the Actions tab ("Run workflow") or `gh workflow run api-deploy.yml`,
# after confirming Vinyl API CI (api-ci.yml) is green for the commit you
# want to ship.
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: api

jobs:
  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    concurrency: deploy-vinyl-api
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly.io
        run: flyctl deploy --config fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_API }}
