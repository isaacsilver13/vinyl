name: Vinyl API CI

on:
  push:
    branches: [main]
    paths: ['api/**']
  pull_request:
    branches: [main]
    paths: ['api/**']

defaults:
  run:
    working-directory: api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/vinyl_api/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python modules
        run: python -m compileall -q vinyl_api tests
      - name: Run tests
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        # `defaults.run.working-directory: api` (above) already puts this
        # step's cwd at api/, matching the build context Fly uses
        # (fly.toml lives in api/ with `dockerfile = 'Dockerfile'`), so the
        # context here is "." rather than "./api".
        run: docker build -t vinyl-api-ci-check .
