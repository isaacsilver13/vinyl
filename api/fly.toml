app = 'vinyl-api'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  VINYL_API_DATABASE_URL = 'sqlite:////data/vinyl_api.db'
  VINYL_API_ENV = 'production'

[[mounts]]
  source = 'vinyl_api_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
