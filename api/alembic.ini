[alembic]
script_location = vinyl_api/alembic
sqlalchemy.url = sqlite:///./vinyl_api_dev.db

# Both script_location above and env.py's `import vinyl_api.models` only
# resolve correctly if `api/` (this file's directory) is on sys.path -- which
# previously only happened by accident (migrate_or_stamp.py's own script
# directory landing on sys.path, or `python -m alembic` adding cwd). A plain
# `alembic` console-script invocation from api/ has neither, so it fails with
# ModuleNotFoundError on vinyl_api. `.` is resolved relative to the *current
# working directory*, not this ini file's location -- so this still requires
# invoking alembic from `api/`, matching the documented workflow in CLAUDE.md.
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
