[client]
# Don't leak raw stack traces / file paths to end users on unhandled errors.
showErrorDetails = "none"

[theme]
base                  = "dark"
primaryColor          = "#e8b84b"
backgroundColor       = "#111111"
secondaryBackgroundColor = "#1c1c1c"
textColor             = "#f0f0f0"
font                  = "sans serif"
